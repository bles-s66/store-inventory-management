name: lab4-monitoring

services:
  webapp:
    build:
      context: ./backend
    container_name: lab4-webapp
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./backend/database.db:/code/database.db
    restart: unless-stopped
    networks:
      - monitoring

  frontend:
    image: nginx:stable-alpine
    container_name: lab4-frontend
    ports:
      - "127.0.0.1:5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - webapp
    restart: unless-stopped
    networks:
      - monitoring

  cadvisor:
    image: ghcr.io/google/cadvisor:v0.60.6
    container_name: lab4-cadvisor
    privileged: true
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:rw
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
    restart: unless-stopped
    networks:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: lab4-prometheus
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=7d
    depends_on:
      - cadvisor
    restart: unless-stopped
    networks:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: lab4-grafana
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/datasources/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
    depends_on:
      - prometheus
    restart: unless-stopped
    networks:
      - monitoring

volumes:
  grafana_data:
  prometheus_data:

networks:
  monitoring:
    driver: bridge
